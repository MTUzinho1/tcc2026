name: BookShare V2 checks
on:
  push:
    branches: [bookshare-v2-reconstrucao]
  pull_request:
    paths:
      - "bookshare-v2/**"
      - ".github/workflows/bookshare-v2.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookshare-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
